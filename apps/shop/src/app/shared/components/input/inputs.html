<div class="flex flex-col gap-1">
  @if (label()) {
    <label [for]="inputId()" class="text-sm font-medium text-slate-700">
      {{ label() }}
    </label>
  }

  <div class="relative flex items-center">
    <input
      [id]="inputId()"
      [type]="currentType()"
      [placeholder]="placeholder()"
      [disabled]="isDisabled()"
      [value]="value()"
      (input)="handleInput($event)"
      (blur)="handleBlur()"
      [class]="inputClasses()"
    />

    @if (type() === 'password') {
      <button
        type="button"
        (click)="togglePassword()"
        [attr.aria-label]="showPassword() ? 'Hide password' : 'Show password'"
        class="absolute end-3 cursor-pointer text-xs font-medium text-slate-500 hover:text-slate-800"
      >
        {{ showPassword() ? 'Hide' : 'Show' }}
      </button>
    }
  </div>

  @if (errorMessage()) {
    <small class="text-xs text-red-600">{{ errorMessage() }}</small>
  }
</div>
